<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9ECE6; --surface:#FBFCFA; --surface-2:#F2F4EE;
    --ink:#15201C; --ink-2:#43514B; --muted:#7C897F; --hair:#D6DBD2;
    --spine:#0B4A3F; --spine-2:#0E5D4E;
    --pos:#1E7F5C; --neg:#B4552D; --gold:#B4832A;
    --shadow:0 1px 2px rgba(20,40,32,.05), 0 8px 24px -12px rgba(20,40,32,.14);
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .tab{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  .wrap{max-width:1120px; margin:0 auto; padding:22px 20px 64px}

  /* ---------- Hero / statement header ---------- */
  .hero{
    background:linear-gradient(160deg, var(--spine) 0%, var(--spine-2) 100%);
    color:#EAF3EF; border-radius:20px; padding:26px 28px 22px;
    position:relative; overflow:hidden; box-shadow:var(--shadow);
  }
  .hero .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:#8FBBAC; font-weight:600; margin:0 0 6px;
  }
  .hero .patri{
    font-family:var(--serif); font-weight:600; letter-spacing:-.01em;
    font-size:clamp(40px, 8vw, 68px); line-height:.98; margin:0;
  }
  .hero .patri small{font-size:.42em; color:#A8Cabc; font-weight:500; letter-spacing:0}
  .hero .delta{margin:10px 0 0; font-size:14px; color:#CFE6DD; display:flex; gap:14px; flex-wrap:wrap; align-items:baseline}
  .hero .delta b{font-weight:600}
  .hero .spark{position:absolute; right:0; bottom:0; width:min(52%,460px); height:120px; opacity:.9}
  @media(max-width:640px){ .hero .spark{position:static; width:100%; height:88px; margin-top:14px; opacity:1} }

  /* ---------- KPI strip ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:12px 0 26px}
  @media(max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} }
  .kpi{background:var(--surface); border:1px solid var(--hair); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow)}
  .kpi .label{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-bottom:7px}
  .kpi .val{font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:-.01em}
  .kpi .sub{font-size:12.5px; color:var(--ink-2); margin-top:3px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}

  /* ---------- Sections ---------- */
  section{margin:34px 0 0}
  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
  .sec-head h2{font-family:var(--serif); font-weight:600; font-size:23px; margin:0; letter-spacing:-.01em}
  .sec-head .note{font-size:12.5px; color:var(--muted)}
  .grid2{display:grid; grid-template-columns:1.35fr 1fr; gap:16px}
  @media(max-width:860px){ .grid2{grid-template-columns:1fr} }
  .card{background:var(--surface); border:1px solid var(--hair); border-radius:var(--r); padding:18px 18px 16px; box-shadow:var(--shadow)}
  .card h3{margin:0 0 2px; font-size:14px; font-weight:600; color:var(--ink)}
  .card .cap{font-size:12px; color:var(--muted); margin:0 0 14px}

  /* ---------- Allocation list ---------- */
  .alloc{display:flex; flex-direction:column; gap:9px; margin-top:4px}
  .alloc-row{display:grid; grid-template-columns:11px 1fr auto; gap:10px; align-items:center}
  .dot{width:11px; height:11px; border-radius:3px}
  .alloc-row .nm{font-size:13.5px; color:var(--ink)}
  .alloc-row .vl{font-size:13.5px; color:var(--ink-2); text-align:right}
  .alloc-row .vl b{color:var(--ink); font-weight:600}
  .bar-thin{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; grid-column:2 / -1; margin-top:-2px}
  .bar-thin > i{display:block; height:100%; border-radius:4px}

  /* ---------- Category bars ---------- */
  .catlist{display:flex; flex-direction:column; gap:11px}
  .cat{display:grid; grid-template-columns:1fr; gap:5px}
  .cat .ct{display:flex; justify-content:space-between; font-size:13.5px}
  .cat .ct span:last-child{color:var(--ink-2)}
  .track{height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden}
  .track > i{display:block; height:100%; border-radius:5px}

  /* ---------- Goal ladder ---------- */
  .ladder{display:flex; flex-direction:column-reverse; gap:0}
  .rung{display:grid; grid-template-columns:74px 1fr 58px; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--hair)}
  .rung:first-child{border-top:0}
  .rung .goal{font-family:var(--serif); font-weight:600; font-size:15px; text-align:right; color:var(--ink)}
  .rung .meter{height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden}
  .rung .meter > i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--spine-2),var(--pos))}
  .rung.done .meter > i{background:linear-gradient(90deg,var(--gold),#D8A94A)}
  .rung .pct{font-size:13px; text-align:right; color:var(--ink-2); font-weight:600}
  .rung.done .pct{color:var(--gold)}

  /* ---------- flow chart wrap ---------- */
  .chart-wrap{width:100%; overflow:hidden}
  svg{display:block; width:100%; height:auto}
  .legend{display:flex; gap:18px; font-size:12.5px; color:var(--ink-2); margin-top:10px; flex-wrap:wrap}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block}

  footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--hair); font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .banner{background:#FBF3E2; border:1px solid #ECD9AE; color:#6E5518; border-radius:12px; padding:11px 14px; font-size:13px; margin:16px 0 0}
  .banner b{font-weight:600}
  @media (prefers-reduced-motion: no-preference){
    .anim{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  }
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .loader{max-width:520px; margin:12vh auto 0; padding:30px 30px 28px; background:var(--surface); border:1px solid var(--hair); border-radius:20px; box-shadow:var(--shadow)}
  .loader code{background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:13px}
  .lo-eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--spine-2); font-weight:600; margin:0 0 8px}
  .lo-title{font-family:var(--serif); font-weight:600; font-size:27px; margin:0 0 10px; letter-spacing:-.01em}
  .lo-text{color:var(--ink-2); margin:0 0 20px; font-size:14.5px}
  .lo-btn{display:inline-block; cursor:pointer; background:var(--spine); color:#EAF3EF; font-weight:600; font-size:14px; padding:11px 18px; border-radius:10px; transition:background .15s}
  .lo-btn:hover{background:var(--spine-2)}
  .lo-name{display:inline-block; margin-left:12px; font-size:13px; color:var(--muted)}
  .lo-err{color:var(--neg); font-size:13px; min-height:18px; margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- snapshot local dos dados (opcional: só existe no modo local, nunca no GitHub Pages) -->
<script src="data.js" onerror="window.__noData=true"></script>
<script>
(function(){
  const app = document.getElementById('app');

  function render(D){
  app.innerHTML='';
  /* ---------- helpers ---------- */
  const brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  const money = v => brl.format(v||0);
  const compact = v => {
    const a=Math.abs(v||0);
    if(a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})+' mi';
    if(a>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:1})+' mil';
    return money(v);
  };
  const pct = v => (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
  const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const rotMes = ym => { const [y,m]=ym.split('-'); return MES[+m-1]+'/'+y.slice(2); };
  const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
  const svgNS='http://www.w3.org/2000/svg';
  const S=(t,a)=>{const e=document.createElementNS(svgNS,t); for(const k in a)e.setAttribute(k,a[k]); return e;};

  // paleta de classes (deep teal -> emerald -> sage -> gold -> clay)
  const PAL=['#0B4A3F','#0E5D4E','#1E7F5C','#3E9B71','#6FB48C','#9CC6A6',
             '#C7B36A','#B4832A','#C98A4B','#B4552D','#8A6F63'];

  const kpi=D.kpis||{}, inv=D.investimentos||{}, flx=D.fluxo||{};
  const evol=inv.evolucao_patrimonio||[];
  const ultPat = evol.length? evol[evol.length-1].valor : (kpi.patrimonio||0);
  const prevPat= evol.length>1? evol[evol.length-2].valor : ultPat;
  const deltaPat = ultPat - prevPat;
  const asOfPat = evol.length? rotMes(evol[evol.length-1].mes) : '';

  /* ---------- HERO ---------- */
  const hero=el('div','hero anim');
  hero.appendChild(el('p','eyebrow','Patrimônio total'));
  const p=el('h1','patri tab'); p.innerHTML=money(kpi.patrimonio||ultPat).replace('R$','<small>R$</small>');
  hero.appendChild(p);
  const dl=el('div','delta');
  const arrow = deltaPat>=0?'▲':'▼';
  dl.innerHTML =
    `<span>${asOfPat?('atualizado '+asOfPat):''}</span>`+
    `<span style="color:${deltaPat>=0?'#8FE3C2':'#F0B79A'}">${arrow} ${money(Math.abs(deltaPat))} <b>no mês</b></span>`+
    `<span>investido: <b class="tab">${money(kpi.investido||0)}</b></span>`;
  hero.appendChild(dl);
  // sparkline
  if(evol.length>1){
    const w=460,h=120,pad=6;
    const xs=evol.map((_,i)=>i), ys=evol.map(d=>d.valor);
    const minY=Math.min(...ys), maxY=Math.max(...ys);
    const X=i=> pad + i*(w-2*pad)/(evol.length-1);
    const Y=v=> (h-pad) - (v-minY)/((maxY-minY)||1)*(h-2*pad-14);
    const svg=S('svg',{viewBox:`0 0 ${w} ${h}`,class:'spark',preserveAspectRatio:'none'});
    let dLine='', dArea='';
    evol.forEach((d,i)=>{ const x=X(i).toFixed(1), y=Y(d.valor).toFixed(1);
      dLine+=(i?'L':'M')+x+' '+y+' '; if(i===0)dArea='M'+x+' '+y+' '; else dArea+='L'+x+' '+y+' ';});
    dArea+=`L${X(evol.length-1).toFixed(1)} ${h} L${X(0).toFixed(1)} ${h} Z`;
    const gid='g'+Math.random().toString(36).slice(2);
    const defs=S('defs'); const lg=S('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
    lg.appendChild(S('stop',{offset:'0%','stop-color':'#8FE3C2','stop-opacity':.34}));
    lg.appendChild(S('stop',{offset:'100%','stop-color':'#8FE3C2','stop-opacity':0}));
    defs.appendChild(lg); svg.appendChild(defs);
    svg.appendChild(S('path',{d:dArea,fill:`url(#${gid})`}));
    svg.appendChild(S('path',{d:dLine,fill:'none',stroke:'#CFEDE0','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    const li=evol.length-1;
    svg.appendChild(S('circle',{cx:X(li),cy:Y(evol[li].valor),r:3.4,fill:'#EAF3EF'}));
    hero.appendChild(svg);
  }
  app.appendChild(hero);

  /* ---------- KPIs ---------- */
  const um=flx.ultimo_mes||{};
  const kwrap=el('div','kpis anim');
  const kdefs=[
    ['Resultado do mês', money(um.resultado||0), (um.resultado>=0?'pos':'neg'),
       (um.mes?('em '+rotMes(um.mes)):'—')],
    ['Entradas', money(um.entradas||0), 'pos', 'no último mês com lançamentos'],
    ['Saídas', money(um.saidas||0), 'neg', 'movimentações reais'],
    ['Gasto anual', money(kpi.gasto_anual||0), '', 'base para independência financeira'],
  ];
  kdefs.forEach(([l,v,cl,s])=>{
    const c=el('div','kpi');
    c.appendChild(el('div','label',l));
    c.appendChild(el('div','val tab '+cl, v));
    c.appendChild(el('div','sub',s));
    kwrap.appendChild(c);
  });
  app.appendChild(kwrap);

  /* ---------- FLUXO DE CAIXA ---------- */
  const sFlow=el('section','anim');
  const fh=el('div','sec-head');
  fh.appendChild(el('h2',null,'Fluxo de caixa'));
  const lastMes = flx.meses&&flx.meses.length? rotMes(flx.meses[flx.meses.length-1].mes):'';
  fh.appendChild(el('div','note','entradas e saídas reais · até '+lastMes));
  sFlow.appendChild(fh);

  const fgrid=el('div','grid2');
  // -- diverging monthly bars --
  const cCol=el('div','card');
  cCol.appendChild(el('h3',null,'Entradas e saídas por mês'));
  cCol.appendChild(el('p','cap','últimos meses · resultado = linha'));
  const meses=(flx.meses||[]).slice(-14);
  {
    const w=640,h=260, padL=44,padR=10,padT=14,padB=26;
    const maxV=Math.max(1,...meses.map(m=>Math.max(m.entradas,m.saidas)));
    const iw=w-padL-padR, ih=h-padT-padB, zero=padT+ih/2;
    const bw=iw/meses.length, bar=Math.min(15,bw*0.36);
    const yScale=v=> (v/maxV)*(ih/2);
    const svg=S('svg',{viewBox:`0 0 ${w} ${h}`,role:'img'});
    // zero line + grid
    svg.appendChild(S('line',{x1:padL,y1:zero,x2:w-padR,y2:zero,stroke:'#C9D0C7','stroke-width':1}));
    [0.5,1].forEach(f=>{
      [-1,1].forEach(s=>{
        const y=zero - s*f*(ih/2);
        svg.appendChild(S('line',{x1:padL,y1:y,x2:w-padR,y2:y,stroke:'#EAEEE7','stroke-width':1}));
        const t=S('text',{x:padL-6,y:y+3,'text-anchor':'end','font-size':9,fill:'#98A69C'});
        t.textContent=compact(f*maxV*s).replace('R$ ',''); svg.appendChild(t);
      });
    });
    // resultado line pts
    let dRes='';
    meses.forEach((m,i)=>{
      const cx=padL + i*bw + bw/2;
      const eH=yScale(m.entradas), sH=yScale(m.saidas);
      svg.appendChild(S('rect',{x:cx-bar-1,y:zero-eH,width:bar,height:Math.max(1,eH),rx:2.5,fill:'#1E7F5C',class:'anim'}));
      svg.appendChild(S('rect',{x:cx+1,y:zero,width:bar,height:Math.max(1,sH),rx:2.5,fill:'#B4552D'}));
      const ry = zero - (m.resultado/maxV)*(ih/2);
      dRes+=(i?'L':'M')+cx.toFixed(1)+' '+ry.toFixed(1)+' ';
      const tx=S('text',{x:cx,y:h-9,'text-anchor':'middle','font-size':9,fill:'#8A968C'});
      tx.textContent=rotMes(m.mes); svg.appendChild(tx);
    });
    svg.appendChild(S('path',{d:dRes,fill:'none',stroke:'#15201C','stroke-width':1.6,'stroke-dasharray':'1 0','opacity':.55}));
    meses.forEach((m,i)=>{const cx=padL+i*bw+bw/2; const ry=zero-(m.resultado/maxV)*(ih/2);
      svg.appendChild(S('circle',{cx,cy:ry,r:2.2,fill:'#15201C'}));});
    const cw=el('div','chart-wrap'); cw.appendChild(svg); cCol.appendChild(cw);
    const lg=el('div','legend',
      '<span><i style="background:#1E7F5C"></i>Entradas</span>'+
      '<span><i style="background:#B4552D"></i>Saídas</span>'+
      '<span><i style="background:#15201C"></i>Resultado</span>');
    cCol.appendChild(lg);
  }
  fgrid.appendChild(cCol);

  // -- despesas por categoria (12m) --
  const cCat=el('div','card');
  cCat.appendChild(el('h3',null,'Para onde vão as saídas'));
  cCat.appendChild(el('p','cap','maiores categorias · últimos 12 meses'));
  {
    const cats=(flx.categorias_saida_12m||[]).slice(0,9);
    const mx=Math.max(1,...cats.map(c=>c.valor));
    const list=el('div','catlist');
    cats.forEach((c,i)=>{
      const row=el('div','cat');
      row.appendChild(el('div','ct',`<span>${c.categoria}</span><span class="tab">${money(c.valor)}</span>`));
      const tr=el('div','track'); const i2=el('i'); 
      i2.style.width=(c.valor/mx*100).toFixed(1)+'%';
      i2.style.background=PAL[6+ (i%3)] || '#B4552D';
      i2.style.background='linear-gradient(90deg,#C98A4B,#B4552D)';
      tr.appendChild(i2); row.appendChild(tr); list.appendChild(row);
    });
    cCat.appendChild(list);
  }
  fgrid.appendChild(cCat);
  sFlow.appendChild(fgrid);
  app.appendChild(sFlow);

  /* ---------- INVESTIMENTOS ---------- */
  const sInv=el('section','anim');
  const ih2=el('div','sec-head');
  ih2.appendChild(el('h2',null,'Posição consolidada'));
  ih2.appendChild(el('div','note','investimentos por classe e por instituição'));
  sInv.appendChild(ih2);

  const igrid=el('div','grid2');
  // donut + allocation list
  const cAlloc=el('div','card');
  cAlloc.appendChild(el('h3',null,'Alocação por classe'));
  cAlloc.appendChild(el('p','cap','total '+money(inv.total_patrimonio||kpi.patrimonio||0)));
  {
    const cls=inv.por_classe||[];
    const donutWrap=el('div',null); donutWrap.style.display='flex'; donutWrap.style.gap='18px';
    donutWrap.style.alignItems='center'; donutWrap.style.flexWrap='wrap';
    // donut
    const sz=150, rO=70, rI=44, cx=sz/2, cy=sz/2;
    const svg=S('svg',{viewBox:`0 0 ${sz} ${sz}`,width:150,height:150}); svg.style.flex='0 0 150px'; svg.style.maxWidth='150px';
    let ang=-Math.PI/2; const tot=cls.reduce((s,c)=>s+c.valor,0)||1;
    cls.forEach((c,i)=>{
      const a2=ang + c.valor/tot*2*Math.PI;
      const large=(a2-ang)>Math.PI?1:0;
      const x1=cx+rO*Math.cos(ang), y1=cy+rO*Math.sin(ang);
      const x2=cx+rO*Math.cos(a2), y2=cy+rO*Math.sin(a2);
      const xi2=cx+rI*Math.cos(a2), yi2=cy+rI*Math.sin(a2);
      const xi1=cx+rI*Math.cos(ang), yi1=cy+rI*Math.sin(ang);
      const d=`M${x1} ${y1} A${rO} ${rO} 0 ${large} 1 ${x2} ${y2} L${xi2} ${yi2} A${rI} ${rI} 0 ${large} 0 ${xi1} ${yi1} Z`;
      svg.appendChild(S('path',{d,fill:PAL[i%PAL.length]}));
      ang=a2;
    });
    const tc=S('text',{x:cx,y:cy-3,'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#15201C','font-family':'Fraunces,Georgia,serif'});
    tc.textContent=compact(tot).replace('R$ ','R$');
    const tc2=S('text',{x:cx,y:cy+13,'text-anchor':'middle','font-size':9,fill:'#7C897F'});
    tc2.textContent='patrimônio';
    svg.appendChild(tc); svg.appendChild(tc2);
    donutWrap.appendChild(svg);
    // list
    const list=el('div','alloc'); list.style.flex='1 1 200px';
    cls.forEach((c,i)=>{
      const row=el('div','alloc-row');
      const d=el('span','dot'); d.style.background=PAL[i%PAL.length];
      row.appendChild(d);
      row.appendChild(el('span','nm',c.classe));
      row.appendChild(el('span','vl',`<b class="tab">${c.pct}%</b> · ${compact(c.valor)}`));
      list.appendChild(row);
    });
    donutWrap.appendChild(list);
    cAlloc.appendChild(donutWrap);
  }
  igrid.appendChild(cAlloc);

  // por conta
  const cConta=el('div','card');
  cConta.appendChild(el('h3',null,'Por instituição'));
  cConta.appendChild(el('p','cap','onde o dinheiro está guardado'));
  {
    const cs=(inv.por_conta||[]).slice(0,10);
    const mx=Math.max(1,...cs.map(c=>c.valor));
    const list=el('div','catlist');
    cs.forEach(c=>{
      const row=el('div','cat');
      row.appendChild(el('div','ct',`<span>${c.conta}</span><span class="tab">${money(c.valor)}</span>`));
      const tr=el('div','track'); const bi=el('i'); bi.style.width=(c.valor/mx*100).toFixed(1)+'%';
      bi.style.background='linear-gradient(90deg,var(--spine-2),var(--pos))';
      tr.appendChild(bi); row.appendChild(tr); list.appendChild(row);
    });
    cConta.appendChild(list);
  }
  igrid.appendChild(cConta);
  sInv.appendChild(igrid);
  app.appendChild(sInv);

  /* ---------- METAS (escada FIRE) ---------- */
  if((D.metas||[]).length){
    const sM=el('section','anim');
    const mh=el('div','sec-head');
    mh.appendChild(el('h2',null,'Metas de investimento'));
    mh.appendChild(el('div','note','progresso rumo à independência financeira'));
    sM.appendChild(mh);
    const card=el('div','card');
    const lad=el('div','ladder');
    D.metas.forEach(m=>{
      const done=m.progresso>=1;
      const rung=el('div','rung'+(done?' done':''));
      rung.appendChild(el('div','goal', m.nome.replace(' Investido','')));
      const meter=el('div','meter'); const fill=el('i'); fill.style.width=Math.min(100,m.progresso*100).toFixed(1)+'%';
      meter.appendChild(fill); rung.appendChild(meter);
      rung.appendChild(el('div','pct', done?'✓':(m.progresso*100).toFixed(0)+'%'));
      lad.appendChild(rung);
    });
    card.appendChild(lad);
    sM.appendChild(card);
    app.appendChild(sM);
  }

  /* ---------- nota de defasagem ---------- */
  if(lastMes && asOfPat && lastMes!==asOfPat){
    const b=el('div','banner',
      `<b>Duas datas de referência:</b> o patrimônio está atualizado até <b>${asOfPat}</b>, `+
      `mas os lançamentos de fluxo de caixa vão até <b>${lastMes}</b>. `+
      `Importe os extratos mais recentes na planilha para alinhar os dois.`);
    app.appendChild(b);
  }

  /* ---------- footer ---------- */
  const f=el('footer');
  f.appendChild(el('div',null,`Gerado em ${ (D.meta&&D.meta.gerado_em)||'—' } · fonte: ${ (D.meta&&D.meta.fonte)||'planilha' }`));
  f.appendChild(el('div',null,'Dados locais · nada é enviado para a internet'));
  app.appendChild(f);
  } // ---- fim render ----

  /* ---------- tela de carregamento (GitHub Pages / sem data.js) ---------- */
  function showLoader(erro){
    app.innerHTML =
      '<div class="loader">'+
        '<p class="lo-eyebrow">Painel financeiro</p>'+
        '<h2 class="lo-title">Carregar dados</h2>'+
        '<p class="lo-text">Selecione o arquivo <code>data.json</code> (ou <code>data.js</code>) '+
          'gerado pelo <code>build_data.py</code>. Ele é lido só no seu navegador — '+
          'nada é enviado para a internet.</p>'+
        '<label class="lo-btn">Escolher arquivo…'+
          '<input id="pick" type="file" accept=".json,.js,application/json" hidden>'+
        '</label>'+
        '<span id="pickname" class="lo-name"></span>'+
        '<p id="perr" class="lo-err">'+(erro||'')+'</p>'+
      '</div>';
    const inp=document.getElementById('pick');
    inp.addEventListener('change', function(){
      const file=this.files[0]; if(!file) return;
      document.getElementById('pickname').textContent=file.name;
      const rd=new FileReader();
      rd.onload=function(){
        try{
          let txt=String(rd.result).trim();
          const i=txt.indexOf('{'), j=txt.lastIndexOf('}');
          if(i>=0 && j>i) txt=txt.slice(i, j+1);   // aceita data.js e data.json
          render(JSON.parse(txt));
        }catch(e){
          showLoader('Não consegui ler esse arquivo. Use o data.json gerado pelo build_data.py.');
        }
      };
      rd.readAsText(file, 'utf-8');
    });
  }

  /* ---------- bootstrap ---------- */
  if(window.FIN_DATA){ render(window.FIN_DATA); }  // modo local (data.js ao lado)
  else { showLoader(); }                            // modo GitHub Pages (upload manual)
})();
</script>
</body>
</html>
